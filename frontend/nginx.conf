server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:avif|gif|jpe?g|mp3|mp4|png|svg|ttf|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /api/ {
        client_max_body_size 500m;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /og/ {
        proxy_pass http://backend:8080/api/posts/og/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /gallery-og/ {
        proxy_pass http://backend:8080/api/files/gallery/og/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /feed-files/ {
        proxy_pass http://storage:9000;
        proxy_set_header Host $host;
    }

    location /imgproxy/ {
        proxy_pass http://imgproxy:8080/;
        proxy_set_header Host $host;
    }

    location ~ ^/posts/public/(?<post_slug>[^/]+)/?$ {
        if ($http_user_agent ~* "TelegramBot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Discordbot|LinkedInBot|vkShare|Viber|SkypeUriPreview") {
            rewrite ^ /api/posts/public/metadata/$post_slug last;
        }
        try_files $uri /index.html;
    }

    location ~ "^/files/gallery/(?<gallery_id>[0-9a-fA-F-]{36})/?$" {
        if ($http_user_agent ~* "TelegramBot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Discordbot|LinkedInBot|vkShare|Viber|SkypeUriPreview") {
            rewrite ^ /api/files/gallery/metadata/$gallery_id last;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}