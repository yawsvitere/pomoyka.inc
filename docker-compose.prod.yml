name: pomoyka.inc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-volume-permissions:
    image: alpine:3.22
    command: >
      sh -c "chown -R 10001:10001 /data /app/logs"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    restart: "no"

  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    depends_on:
      storage-volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:?S3_ACCESS_KEY is required}}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?S3_SECRET_KEY is required}}
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:?S3_ACCESS_KEY is required}}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?S3_SECRET_KEY is required}}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-${MINIO_BUCKET:?S3_BUCKET is required}}
    command:
      - |
        set -eu
        attempt=0
        until aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 5 ]; then
            aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET"
            break
          fi
          sleep 2
        done
        aws --endpoint-url "$$S3_ENDPOINT" s3api put-bucket-policy \
          --bucket "$$S3_BUCKET" \
          --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$${S3_BUCKET}/*\"}]}"
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    depends_on:
      storage:
        condition: service_healthy
    environment:
      IMGPROXY_LOG_LEVEL: "warn"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      imgproxy:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeysPath: /root/.aspnet/DataProtection-Keys
      DataProtection__CertificatePath: /root/.aspnet/DataProtection-Keys/key-encryption.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERT_PASSWORD}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Minio__Endpoint: storage:9000
      Minio__PublicEndpoint: ${S3_PUBLIC_ENDPOINT:-${MINIO_PUBLIC_ENDPOINT:-localhost}}
      Minio__AccessKey: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:?S3_ACCESS_KEY is required}}
      Minio__SecretKey: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?S3_SECRET_KEY is required}}
      Minio__Bucket: ${S3_BUCKET:-${MINIO_BUCKET:?S3_BUCKET is required}}
      Minio__UseSSL: "false"
      Imgproxy__Endpoint: "http://imgproxy:8080"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: FeedApi
      Jwt__Audience: FeedClient
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
      - imgproxy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
  dataprotection_keys:
